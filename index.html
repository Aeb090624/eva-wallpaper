<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://busuanzi.ibruce.info; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>EVA壁纸库</title>
<style>
  :root {
    --eva-purple: #A855F7;
    --eva-green2: #B3FF2E;
    --eva-dark: #0d0818;
    --eva-panel: #1a1030;
    --eva-border: #3b1f6e;
    --eva-green: #00ff88;
    --eva-text: #e0e0e0;
    --eva-text-dim: #888;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: var(--eva-dark);
    color: var(--eva-text);
    min-height: 100vh;
    background-image:
      url('assets/bg.jpg'),
      radial-gradient(ellipse at 20% 0%, rgba(168,85,247,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(179,255,46,0.10) 0%, transparent 50%);
    background-size: cover, auto, auto;
    background-position: center, 0 0, 0 0;
  }

  /* 初号机背景遮罩，保证文字可读 */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0;
    background: rgba(13, 8, 24, 0.74);
    pointer-events: none;
  }
  .header, .categories, .gallery, .footer { position: relative; z-index: 1; }
  /* 顶部导航 */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--eva-border);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    font-size: 22px; font-weight: 700; letter-spacing: 3px;
    color: var(--eva-purple);
    text-shadow: 0 0 20px rgba(168,85,247,0.4);
  }
  .logo span {
    color: var(--eva-green);
    font-size: 14px; font-weight: 700; margin-left: 10px; letter-spacing: 1px;
    text-shadow: 0 0 16px rgba(0,255,136,0.55);
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .admin-badge {
    font-size: 12px; padding: 4px 10px; border-radius: 4px;
    background: rgba(0,255,136,0.15); color: var(--eva-green);
    border: 1px solid rgba(0,255,136,0.3); display: none;
  }
  .admin-badge.active { display: inline-block; }
  .visitor-badge {
    font-size: 12px; padding: 4px 10px; border-radius: 4px;
    background: rgba(168,85,247,0.15); color: var(--eva-purple);
    border: 1px solid rgba(168,85,247,0.35);
    display: none; align-items: center; gap: 6px; cursor: default; user-select: none;
  }
  .visitor-badge.active { display: inline-flex; }
  .visitor-badge .eye { font-size: 15px; line-height: 1; }
  .visitor-badge .num { font-weight: 700; font-size: 13px; color: #fff; }
  .visitor-badge .label { color: var(--eva-text-dim); font-size: 11px; }
  .icon-btn {
    background: none; border: 1px solid var(--eva-border); color: var(--eva-text-dim);
    width: 38px; height: 38px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: all 0.2s;
  }
  .icon-btn:hover { border-color: var(--eva-purple); color: var(--eva-purple); }
  .upload-btn {
    background: var(--eva-purple); color: #fff; border: none;
    padding: 8px 18px; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600; display: none;
    transition: all 0.2s;
  }
  .upload-btn:hover { background: #a855f7; box-shadow: 0 0 15px rgba(168,85,247,0.4); }
  .upload-btn.active { display: inline-block; }
  .logout-btn {
    background: none; border: 1px solid #ff4444; color: #ff4444;
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    font-size: 13px; display: none; transition: all 0.2s;
  }
  .logout-btn.active { display: inline-block; }
  .logout-btn:hover { background: rgba(255,68,68,0.1); }

  /* 分类标签 */
  .categories {
    display: flex; gap: 8px; padding: 16px 24px; flex-wrap: wrap;
    justify-content: center;
  }
  .cat-btn {
    background: var(--eva-panel); border: 1px solid var(--eva-border);
    color: var(--eva-text-dim); padding: 8px 20px; border-radius: 20px;
    cursor: pointer; font-size: 14px; transition: all 0.2s;
  }
  .cat-btn:hover { border-color: var(--eva-purple); color: var(--eva-text); }
  .cat-btn.active {
    background: var(--eva-purple); border-color: var(--eva-purple);
    color: #fff; font-weight: 600;
  }

  /* 壁纸网格 */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px; padding: 0 24px 40px; max-width: 1400px; margin: 0 auto;
  }
  .wall-card {
    position: relative; border-radius: 10px; overflow: hidden;
    background: var(--eva-panel); border: 1px solid var(--eva-border);
    cursor: pointer; transition: all 0.3s; aspect-ratio: 9/16;
  }
  .wall-card:hover {
    transform: translateY(-4px);
    border-color: var(--eva-purple);
    box-shadow: 0 8px 30px rgba(168,85,247,0.2);
  }
  .wall-card img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    background: linear-gradient(135deg, #1a1030 0%, #2a1a4e 100%);
  }
  .wall-card .cat-label {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    padding: 20px 10px 8px; font-size: 12px; color: #fff;
  }
  .del-btn {
    position: absolute; top: 8px; right: 8px;
    background: rgba(255,68,68,0.9); color: #fff; border: none;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    font-size: 14px; display: none; z-index: 5;
    align-items: center; justify-content: center;
  }
  .del-btn:hover { background: #ff2222; }
  .admin-mode .del-btn { display: flex; }

  /* 空状态 */
  .empty {
    text-align: center; padding: 80px 20px; color: var(--eva-text-dim);
  }
  .empty .big { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }

  /* 大图查看器 */
  .viewer {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.95); display: none;
    align-items: center; justify-content: center;
  }
  .viewer.active { display: flex; }
  .viewer img {
    max-width: 90vw; max-height: 85vh; object-fit: contain;
    border-radius: 4px;
  }
  .viewer-close {
    position: absolute; top: 20px; right: 24px;
    background: none; border: none; color: #fff; font-size: 32px;
    cursor: pointer; opacity: 0.7;
  }
  .viewer-close:hover { opacity: 1; }
  .viewer-info {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center;
  }
  .viewer-download {
    background: var(--eva-purple); color: #fff; border: none;
    padding: 10px 24px; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600; text-decoration: none;
    display: inline-block;
  }
  .viewer-download:hover { background: #a855f7; }
  .viewer-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
    font-size: 24px; display: flex; align-items: center; justify-content: center;
  }
  .viewer-nav:hover { background: rgba(255,255,255,0.2); }
  .viewer-prev { left: 20px; }
  .viewer-next { right: 20px; }

  /* 弹窗通用 */
  .modal-mask {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.7); display: none;
    align-items: center; justify-content: center;
  }
  .modal-mask.active { display: flex; }
  .modal {
    background: var(--eva-panel); border: 1px solid var(--eva-border);
    border-radius: 12px; padding: 28px; width: 90%; max-width: 420px;
  }
  .modal h3 {
    font-size: 18px; margin-bottom: 20px; color: var(--eva-purple);
    letter-spacing: 1px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 13px; color: var(--eva-text-dim);
    margin-bottom: 6px;
  }
  .form-group input, .form-group select {
    width: 100%; padding: 10px 12px; background: var(--eva-dark);
    border: 1px solid var(--eva-border); border-radius: 6px;
    color: var(--eva-text); font-size: 14px; outline: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--eva-purple);
  }
  .form-group input[type="file"] { padding: 8px; }
  .modal-actions {
    display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px;
  }
  .btn {
    padding: 9px 20px; border-radius: 6px; cursor: pointer;
    font-size: 14px; border: none; transition: all 0.2s;
  }
  .btn-primary { background: var(--eva-purple); color: #fff; }
  .btn-primary:hover { background: #a855f7; }
  .btn-cancel { background: none; color: var(--eva-text-dim); border: 1px solid var(--eva-border); }
  .btn-cancel:hover { color: var(--eva-text); border-color: var(--eva-text-dim); }
  .btn-danger { background: #ff4444; color: #fff; }
  .btn-danger:hover { background: #ff2222; }

  /* Toast */
  .toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: var(--eva-panel); border: 1px solid var(--eva-border);
    padding: 12px 24px; border-radius: 8px; z-index: 500;
    font-size: 14px; display: none; max-width: 80%;
  }
  .toast.active { display: block; animation: fadeIn 0.3s; }
  .toast.success { border-color: var(--eva-green); color: var(--eva-green); }
  .toast.error { border-color: #ff4444; color: #ff4444; }
  @keyframes fadeIn { from { opacity: 0; top: 60px; } to { opacity: 1; top: 80px; } }

  /* 加载 */
  .loading {
    text-align: center; padding: 60px; color: var(--eva-text-dim);
  }
  .spinner {
    display: inline-block; width: 30px; height: 30px;
    border: 3px solid var(--eva-border); border-top-color: var(--eva-purple);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 页脚 */
  .footer {
    text-align: center; padding: 30px; color: var(--eva-text-dim);
    font-size: 12px; border-top: 1px solid var(--eva-border);
  }

  /* 响应式（手机端专门适配：两行导航 + 3列分类 + 2列画廊） */
  @media (max-width: 600px) {
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 12px 30px; }
    .header { flex-wrap: wrap; gap: 6px 10px; padding: 10px 14px; }
    .logo { font-size: 17px; letter-spacing: 2px; white-space: nowrap; }
    .logo span { font-size: 11px; margin-left: 8px; letter-spacing: 1px; }
    /* 操作按钮整体换到第二行，避免和 logo 挤在一起 */
    .header-right { width: 100%; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
    .admin-badge, .visitor-badge { font-size: 11px; padding: 3px 8px; }
    .visitor-badge .label { display: none; }
    .upload-btn { padding: 7px 14px; font-size: 13px; }
    .logout-btn, .del-mode-btn { padding: 7px 12px; font-size: 12px; }
    .icon-btn { width: 34px; height: 34px; }
    /* 分类标签：6 个排成 3x2 整齐网格 */
    .categories { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 14px; }
    .cat-btn { padding: 9px 4px; font-size: 13px; text-align: center; width: 100%; }
    .delete-toolbar { padding: 8px 12px; gap: 8px; }
    .delete-toolbar .btn { font-size: 12px; padding: 6px 10px; }
  }

  /* ===== 密码显示切换 ===== */
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 44px; }
  .pw-eye {
    position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 16px;
    color: var(--eva-text-dim); padding: 4px; line-height: 1; z-index: 2;
  }
  .pw-eye:hover { color: var(--eva-purple); }
  .token-hint { font-size: 11px; color: var(--eva-text-dim); margin-top: 5px; min-height: 15px; }

  /* ===== 删除模式按钮 ===== */
  .del-mode-btn {
    background: none; border: 1px solid #ff4444; color: #ff4444;
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    font-size: 13px; display: none; transition: all 0.2s;
  }
  .del-mode-btn.active { display: inline-block; }
  .del-mode-btn:hover { background: rgba(255,68,68,0.1); }
  .del-mode-btn.on { background: #ff4444; color: #fff; }

  /* ===== 删除工具栏 ===== */
  .delete-toolbar {
    display: none; align-items: center; justify-content: center; gap: 12px;
    padding: 10px 24px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .delete-toolbar.active { display: flex; }
  .delete-toolbar .count { font-size: 14px; color: var(--eva-text); }
  .delete-toolbar .count b { color: #ff4444; font-size: 16px; }

  /* ===== 勾选圆圈 ===== */
  .wall-card .check-circle {
    position: absolute; top: 8px; right: 8px; z-index: 6;
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #fff; background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    font-size: 14px; color: #fff; line-height: 1; user-select: none;
  }
  .delete-mode .wall-card .check-circle { display: flex; }
  .wall-card .check-circle.checked { background: #ff4444; border-color: #ff4444; }
  .delete-mode .wall-card { cursor: pointer; }
  .delete-mode .wall-card img { opacity: 0.85; }
  .delete-mode .wall-card .check-circle.checked + img { opacity: 0.6; }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="header">
  <div class="logo">EVA<span>WALLPAPER LIBRARY</span></div>
  <div class="header-right">
    <span class="admin-badge" id="adminBadge">管理员模式</span>
    <span class="visitor-badge" id="visitorBadge" title="累计去重访客数（同一访客只计一次）"><span class="eye">👁</span><span class="num" id="busuanzi_value_site_uv">--</span><span class="label">访客</span></span>
    <button class="upload-btn" id="uploadBtn" onclick="openUploadModal()">+ 上传壁纸</button>
    <button class="del-mode-btn" id="delModeBtn" onclick="toggleDeleteMode()">🗑 删除壁纸</button>
    <button class="logout-btn" id="logoutBtn" onclick="logoutAdmin()">退出管理</button>
    <button class="icon-btn" onclick="openSettings()" title="设置">⚙</button>
  </div>
</div>

<!-- 分类标签 -->
<div class="categories" id="categories"></div>

<!-- 删除工具栏（管理员删除模式） -->
<div class="delete-toolbar" id="deleteToolbar">
  <span class="count">已选 <b id="selCount">0</b> 张</span>
  <button class="btn btn-danger" onclick="batchDelete()">删除选中</button>
  <button class="btn btn-cancel" onclick="exitDeleteMode()">取消</button>
</div>

<!-- 壁纸网格 -->
<div class="gallery" id="gallery"></div>

<!-- 大图查看器 -->
<div class="viewer" id="viewer">
  <button class="viewer-close" onclick="closeViewer()">×</button>
  <button class="viewer-nav viewer-prev" onclick="navViewer(-1)">‹</button>
  <img id="viewerImg" src="" alt="">
  <button class="viewer-nav viewer-next" onclick="navViewer(1)">›</button>
  <div class="viewer-info">
    <a class="viewer-download" id="viewerDownload" href="" download>下载壁纸</a>
  </div>
</div>

<!-- 设置/管理员登录弹窗 -->
<div class="modal-mask" id="settingsModal">
  <div class="modal">
    <h3>⚙ 管理员设置</h3>
    <div class="form-group">
      <label>GitHub 用户名</label>
      <input type="text" id="cfgOwner" placeholder="你的GitHub账号名">
    </div>
    <div class="form-group">
      <label>仓库名称</label>
      <input type="text" id="cfgRepo" placeholder="仓库名，如 eva-wallpaper">
    </div>
    <div class="form-group">
      <label>分支</label>
      <input type="text" id="cfgBranch" value="main" placeholder="main">
    </div>
    <div class="form-group">
      <label>管理员密码（GitHub Token）</label>
      <div class="pw-wrap">
        <input type="password" id="cfgToken" placeholder="粘贴你的GitHub私人令牌" autocomplete="off">
        <button type="button" class="pw-eye" id="pwEye" onclick="togglePw()" title="显示/隐藏密码">👁</button>
      </div>
      <div class="token-hint" id="tokenHint"></div>
    </div>
    <div style="font-size:11px;color:var(--eva-text-dim);line-height:1.6;margin-top:8px;">
      Token 仅保存在你当前浏览器中，不会上传到任何服务器。<br>
      普通访客无需输入，只能浏览和下载。
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存并进入管理</button>
    </div>
  </div>
</div>

<!-- 上传弹窗 -->
<div class="modal-mask" id="uploadModal">
  <div class="modal">
    <h3>上传壁纸</h3>
    <div class="form-group">
      <label>选择分类</label>
      <select id="uploadCategory">
        <option value="asuka">明日香</option>
        <option value="rei">绫波丽</option>
        <option value="shinji">碇真嗣</option>
        <option value="kaworu">渚薰</option>
        <option value="makinami">真希波</option>
      </select>
    </div>
    <div class="form-group">
      <label>选择图片（支持 JPG/PNG/WebP，可一次多选）</label>
      <input type="file" id="uploadFile" accept="image/*" multiple>
      <p style="font-size:12px;color:var(--eva-text-dim);margin-top:6px;">支持一次选择多张（最多 20 张），批量上传更快</p>
    </div>
    <div id="uploadProgress" style="display:none;margin-top:10px;padding:10px;border-radius:10px;background:rgba(168,85,247,0.12);color:var(--eva-text);font-size:13px;text-align:center;"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeUploadModal()">取消</button>
      <button class="btn btn-primary" id="uploadConfirmBtn" onclick="doUpload()">确认上传</button>
    </div>
  </div>
</div>

<!-- 删除确认弹窗 -->
<div class="modal-mask" id="deleteModal">
  <div class="modal">
    <h3>确认删除</h3>
    <p style="color:var(--eva-text-dim);font-size:14px;margin-bottom:8px;">确定要删除这张壁纸吗？删除后无法恢复。</p>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeDeleteModal()">取消</button>
      <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== 配置 ==========
const CATEGORIES = [
  { key: 'all', name: '全部' },
  { key: 'asuka', name: '明日香' },
  { key: 'rei', name: '绫波丽' },
  { key: 'shinji', name: '碇真嗣' },
  { key: 'kaworu', name: '渚薰' },
  { key: 'makinami', name: '真希波' }
];
const CAT_MAP = {};
CATEGORIES.forEach(c => CAT_MAP[c.key] = c.name);

// ========== 状态 ==========
let state = {
  images: [],
  currentCat: 'all',
  adminMode: false,
  config: { owner: '', repo: '', branch: 'main', token: '' },
  viewerIndex: 0,
  viewerList: [],
  deleteTarget: null,
  deleteMode: false,
  selectedIds: new Set(),
  unsavedItems: []
};

// ========== 初始化 ==========
function init() {
  loadConfig();
  renderCategories();
  loadImages();
}

function loadConfig() {
  const saved = localStorage.getItem('eva_config');
  if (saved) {
    try { state.config = JSON.parse(saved); } catch(e) {}
  }
  if (state.config.token) {
    state.adminMode = true;
    updateAdminUI();
  }
}

function saveConfigToStorage() {
  localStorage.setItem('eva_config', JSON.stringify(state.config));
}

// ========== 渲染分类 ==========
function renderCategories() {
  const el = document.getElementById('categories');
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="cat-btn ${state.currentCat === c.key ? 'active' : ''}" onclick="switchCategory('${c.key}')">${c.name}</button>`
  ).join('');
}

function switchCategory(key) {
  state.currentCat = key;
  renderCategories();
  renderGallery();
}

// ========== 加载图片列表 ==========
async function loadImages() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px;">加载中...</p></div>';

  try {
    // 尝试从 manifest.json 读取
    const manifest = await fetchManifest();
    if (manifest && manifest.images) {
      state.images = manifest.images;
    } else {
      state.images = [];
    }
  } catch(e) {
    console.warn('读取manifest失败，使用空列表', e);
    state.images = [];
  }
  // 管理员自愈：自动补录"文件已上传但列表没记录"的图、清除"列表有但文件已删"的黑图记录
  if (state.adminMode && state.config.token) selfHealManifest();
  renderGallery();
}

async function fetchManifest() {
  const { owner, repo, branch } = state.config;
  if (!owner || !repo) {
    // 没有配置时，尝试相对路径读取（同仓库部署）
    try {
      const res = await fetch('manifest.json?t=' + Date.now());
      if (res.ok) return await res.json();
    } catch(e) {}
    return { images: [] };
  }
  // 通过GitHub API读取
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/manifest.json?ref=${branch}`;
  const headers = { 'Accept': 'application/vnd.github.v3+json' };
  if (state.config.token) headers['Authorization'] = `token ${state.config.token}`;
  const res = await fetch(url, { headers });
  if (!res.ok) return { images: [] };
  const data = await res.json();
  const content = atob(data.content.replace(/\n/g, ''));
  try { return JSON.parse(content); } catch(e) { return { images: [] }; }
}

// ========== 渲染画廊 ==========
function renderGallery() {
  const gallery = document.getElementById('gallery');
  const filtered = state.currentCat === 'all'
    ? state.images
    : state.images.filter(img => img.category === state.currentCat);

  if (filtered.length === 0) {
    gallery.innerHTML = `
      <div class="empty" style="grid-column:1/-1;">
        <div class="big">📷</div>
        <p>暂无壁纸</p>
        ${state.adminMode && !state.deleteMode ? '<p style="margin-top:8px;font-size:13px;">点击右上角"上传壁纸"添加</p>' : ''}
        ${state.adminMode && state.deleteMode ? '<p style="margin-top:8px;font-size:13px;">当前分类没有可删除的壁纸</p>' : ''}
      </div>`;
    return;
  }

  gallery.innerHTML = filtered.map((img, idx) => {
    const realIdx = state.images.indexOf(img);
    // 防御：id 只允许字母数字下划线，杜绝属性/脚本注入
    const safeId = /^[A-Za-z0-9_]+$/.test(String(img.id || '')) ? img.id : ('img_' + idx);
    const isSel = state.selectedIds.has(safeId);
    const checkHtml = state.deleteMode
      ? `<div class="check-circle ${isSel ? 'checked' : ''}" onclick="event.stopPropagation();toggleSelect('${safeId}')">${isSel ? '✓' : ''}</div>`
      : '';
    const clickAct = state.deleteMode
      ? `onclick="toggleSelect('${safeId}')"`
      : `onclick="openViewer(${realIdx})"`;
    return `
      <div class="wall-card" ${clickAct} data-id="${safeId}">
        ${checkHtml}
        <img src="${getImageUrl(img)}" alt="${escapeHtml(CAT_MAP[img.category] || img.category)}" loading="lazy">
        <div class="cat-label">${escapeHtml(CAT_MAP[img.category] || img.category)}</div>
      </div>`;
  }).join('');
}

function getImageUrl(img) {
  const { owner, repo, branch } = state.config;
  // 防缓存：给每个图片链接加独立版本号，避免 GitHub CDN 缓存导致"新图黑块/删了还在"
  const v = String(img.id || '').replace(/[^A-Za-z0-9]/g, '') || String(img.uploadTime || '').replace(/[^0-9]/g, '') || '0';
  if (owner && repo) {
    return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${img.path}?v=${v}`;
  }
  return img.path + '?v=' + v;
}

function openViewer(index) {

function updateViewer() {
  const img = state.viewerList[state.viewerIndex];
  if (!img) return;
  const url = getImageUrl(img);
  document.getElementById('viewerImg').src = url;
  const dl = document.getElementById('viewerDownload');

  dl.download = img.filename || 'wallpaper.jpg';

// 下载壁纸：跨域图片直接点 <a download> 会被浏览器忽略（变成打开图片预览），
// 这里用 fetch 转 Blob + ObjectURL 强制触发真实文件下载
async function downloadWallpaper() {
  const img = state.viewerList[state.viewerIndex];
  if (!img) return;
  const url = getImageUrl(img);
  try {
    const resp = await fetchWithTimeout(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob = await resp.blob();
    let name = img.filename || 'wallpaper';
    if (!/\.[a-z0-9]+$/i.test(name)) name += '.jpg';
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 8000);
    showToast('已开始下载，文件保存在浏览器下载目录', 'success');
  } catch(e) {
    showToast('下载失败，请长按图片保存', 'error');
    window.open(url, '_blank');
  }
}
document.getElementById('viewerDownload').addEventListener('click', (e) => {
  e.preventDefault();
  downloadWallpaper();
});

// 点击大图弹窗空白处关闭；点图片/按钮/信息条不关闭（下载按钮不会触发关闭）
document.getElementById('viewer').addEventListener('click', (e) => {

});

function navViewer(dir) {
  state.viewerIndex = (state.viewerIndex + dir + state.viewerList.length) % state.viewerList.length;

}

    if (e.key === 'ArrowLeft') navViewer(-1);
    if (e.key === 'ArrowRight') navViewer(1);
  }
});

async function saveSettings() {
  // 防爆破：连续输错 Token 触发冷却锁定
  let failedAttempts = parseInt(localStorage.getItem('eva_fails') || '0', 10);
  let lockUntil = parseInt(localStorage.getItem('eva_lock') || '0', 10);
  if (Date.now() < lockUntil) {
    showToast('验证失败次数过多，请 ' + Math.ceil((lockUntil - Date.now()) / 1000) + ' 秒后再试', 'error');
    return;
  }
  const owner = document.getElementById('cfgOwner').value.trim();
  const repo = document.getElementById('cfgRepo').value.trim();
  const branch = document.getElementById('cfgBranch').value.trim() || 'main';
  const token = document.getElementById('cfgToken').value.trim();

  if (!owner || !repo) {
    showToast('请填写GitHub用户名和仓库名称', 'error');
    return;
  }

  state.config = { owner, repo, branch, token };
  saveConfigToStorage();

  if (token) {
    // 验证Token
    try {
      const res = await fetch('https://api.github.com/user', {
        headers: { 'Authorization': `token ${token}` }
      });
      if (!res.ok) throw new Error('Token无效');
      state.adminMode = true;
      localStorage.removeItem('eva_fails');
      localStorage.removeItem('eva_lock');
      updateAdminUI();
      showToast('管理员验证成功！', 'success');
      closeSettings();
      loadImages();
    } catch(e) {
      failedAttempts++;
      const waitSec = Math.min(60, failedAttempts * 10);
      localStorage.setItem('eva_fails', String(failedAttempts));
      localStorage.setItem('eva_lock', String(Date.now() + waitSec * 1000));
      showToast('Token验证失败，' + waitSec + ' 秒内无法再次尝试', 'error');
      state.adminMode = false;
      updateAdminUI();
    }
  } else {
    state.adminMode = false;
    updateAdminUI();
    closeSettings();
    showToast('设置已保存（未开启管理员模式）', 'success');
    loadImages();
  }
}

async function batchDelete() {
  const ids = Array.from(state.selectedIds);
  if (ids.length === 0) { showToast('请先勾选要删除的壁纸', 'error'); return; }
  if (!confirm(`确定删除选中的 ${ids.length} 张壁纸？删除后无法恢复。`)) return;
  const { owner, repo, branch, token } = state.config;
  const headers = {
    'Authorization': 'token ' + token,
    'Content-Type': 'application/json',
    'Accept': 'application/vnd.github.v3+json'
  };

  const toRemove = ids.map(id => state.images.find(i => i.id === id)).filter(Boolean);

  // 并发获取 sha（每张一次请求，4 路并发）；文件已不存在(404)则标记 missing，同样视为可删
  const shaResults = await runWithConcurrency(toRemove, 4, async (img) => {
    const fr = await fetchWithTimeout(`https://api.github.com/repos/${owner}/${repo}/contents/${img.path}?ref=${branch}`, { headers });
    if (fr.status === 404) return { img, sha: null, missing: true };
    if (!fr.ok) throw new Error('获取文件信息失败');
    const fd = await fr.json();
    return { img, sha: fd.sha, missing: false };
  });

  // 并发删除真实存在的文件（4 路并发）；missing 的不用删文件
  let okCount = 0;
  const delResults = await runWithConcurrency(shaResults.filter(r => r.ok && !r.value.missing), 4, async (r) => {
    const dr = await fetchWithTimeout(`https://api.github.com/repos/${owner}/${repo}/contents/${r.value.img.path}`, {
      method: 'DELETE', headers,
      body: JSON.stringify({ message: `删除壁纸: ${r.value.img.filename}`, sha: r.value.sha, branch })
    });
    if (!dr.ok) throw new Error('删除请求失败');
  });
  delResults.forEach(r => { if (r.ok) okCount++; });
  okCount += shaResults.filter(r => r.ok && r.value.missing).length;

  // 一次更新 manifest（合并所有删除项，含幽灵记录）
  const removedImgs = shaResults.filter(r => r.ok).map(r => r.value.img);
  let listSaved = true;
  if (removedImgs.length > 0) {
    try { await updateManifest('removeMany', removedImgs); }
    catch(e) { listSaved = false; }
  }

  // 本地立即移除已删图片并渲染，不等 GitHub 缓存
  const rmIds = new Set(removedImgs.map(i => i.id));
  state.images = state.images.filter(i => !rmIds.has(i.id));
  exitDeleteMode();
  renderGallery();

  if (!listSaved && removedImgs.length > 0) {
    showToast('文件已删除，但列表更新失败：旧记录刷新后可能短暂出现，重新进入管理员模式会自动清除', 'error');
  } else {
    showToast(okCount > 0 ? `已删除 ${okCount} 张壁纸` : '删除失败', okCount > 0 ? 'success' : 'error');
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      // 去掉 data:image/xxx;base64, 前缀
      const result = reader.result;
      const base64 = result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// 并发执行器：限制同时进行数量，加快批量上传/删除
async function runWithConcurrency(items, limit, fn) {
  const results = new Array(items.length);
  let idx = 0;
  const workers = Array(Math.min(limit, items.length)).fill(0).map(async () => {
    while (idx < items.length) {
      const cur = idx++;
      try { results[cur] = { ok: true, value: await fn(items[cur], cur) }; }
      catch(e) { results[cur] = { ok: false, error: e }; }
    }
  });
  await Promise.all(workers);
  return results;
}

// HTML 转义：防止把文件名等内容注入为 HTML
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// 带超时的 fetch（防止网络卡住无限等待）
async function fetchWithTimeout(url, options, timeoutMs = 120000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
}

// 单张上传 + 自动重试（最多 3 次，逐步加长间隔；遇限流等更久）
async function uploadFileWithRetry(file, category, headers, owner, repo, branch, baseTime, i) {
  const delays = [1200, 2500, 4000];
  let lastErr = null;
  for (let attempt = 0; attempt <= delays.length; attempt++) {
    if (attempt > 0) await new Promise(r => setTimeout(r, delays[attempt - 1]));
    try {
      const timestamp = baseTime + i;
      const safeName = file.name.replace(/[^\w.\-一-龥]/g, '_');
      const filename = `${timestamp}_${safeName}`;
      const path = `images/${category}/${filename}`;
      const base64 = await fileToBase64(file);
      const uploadRes = await fetchWithTimeout(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: 'PUT', headers,
        body: JSON.stringify({ message: `上传壁纸: ${filename}`, content: base64, branch })
      });
      if (!uploadRes.ok) {
        let msg = '上传失败 HTTP ' + uploadRes.status;
        try { const err = await uploadRes.json(); msg = err.message || msg; } catch(e) {}
        // 403/429 是限流，多等一会再试
        if (uploadRes.status === 403 || uploadRes.status === 429) await new Promise(r => setTimeout(r, 8000));
        throw new Error(msg);
      }
      return { timestamp, filename, path };
    } catch(e) {
      lastErr = e;
      if (e && e.name === 'AbortError') lastErr = new Error('上传超时（网络慢），已自动重试');
    }
  }
  throw lastErr;
}

// ========== 批量上传 ==========
let pendingRetryFiles = [];
let failedUploadFiles = [];

async function doUpload() {
  const files = pendingRetryFiles.length > 0
    ? pendingRetryFiles.slice()
    : Array.from(document.getElementById('uploadFile').files);
  pendingRetryFiles = [];
  const category = document.getElementById('uploadCategory').value;
  if (files.length === 0) { showToast('请选择图片文件', 'error'); return; }
  if (files.length > 20) { showToast('一次最多上传 20 张，请分批选择', 'error'); return; }
  // 只允许图片类型，防上传非图片文件（防恶意文件）
  const isImage = f => (/^image\//.test(f.type || '')) || /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name || '');
  const badType = files.filter(f => !isImage(f));
  if (badType.length > 0) { showToast(`「${badType[0].name}」不是支持的图片格式，已跳过`, 'error'); }
  const bigFiles = files.filter(f => f.size > 50 * 1024 * 1024);
  if (bigFiles.length > 0) { showToast(`「${bigFiles[0].name}」超过 50MB，已跳过`, 'error'); }
  const validFiles = files.filter(f => f.size <= 50 * 1024 * 1024 && isImage(f));
  if (validFiles.length === 0) { showToast('没有可上传的图片', 'error'); return; }

  const btn = document.getElementById('uploadConfirmBtn');
  const progress = document.getElementById('uploadProgress');
  btn.disabled = true;
  progress.style.display = 'block';
  progress.innerHTML = `准备上传 ${validFiles.length} 张...`;

  try {
    const { owner, repo, branch, token } = state.config;
    const headers = {
      'Authorization': `token ${token}`,
      'Content-Type': 'application/json',
      'Accept': 'application/vnd.github.v3+json'
    };
    const newItems = [];
    const failed = [];
    const baseTime = Date.now();

    // 并发 2 张上传，每张自动重试 3 次，带进度
    await runWithConcurrency(validFiles, 2, async (file, i) => {
      progress.innerHTML = `正在上传（${i + 1}/${validFiles.length}）…`;
      try {
        const r = await uploadFileWithRetry(file, category, headers, owner, repo, branch, baseTime, i);
        newItems.push({ id: 'img_' + r.timestamp, filename: r.filename, category, path: r.path, uploadTime: new Date().toISOString() });
        progress.innerHTML = `正在上传（已成功 ${newItems.length} 张，失败 ${failed.length} 张）…`;
      } catch(e) {
        failed.push({ file, error: e });
        progress.innerHTML = `正在上传（已成功 ${newItems.length} 张，失败 ${failed.length} 张）…`;
      }
    });

    // 一次更新 manifest（合并所有新图）。
    // 关键：列表保存失败 = 图片没真正"上线"（刷新会消失），本地绝不假装成功，必须提供重试
    let listSaved = true;
    if (newItems.length > 0) {
      try { await updateManifest('addMany', newItems); }
      catch(e) { listSaved = false; state.unsavedItems = newItems.slice(); }
    }

    btn.disabled = false; btn.textContent = '确认上传';

    if (!listSaved) {
      failedUploadFiles = failed.map(f => f.file);
      progress.style.display = 'block';
      progress.innerHTML = `<div style="color:#ffb84d;font-weight:700;">图片已上传到仓库，但列表保存失败（刷新后会消失）</div>
        <div style="margin-top:6px;color:#ff6666;">失败 ${failed.length} 张：${failed.map(f => escapeHtml(f.file.name)).join('、') || '无'}</div>
        <button class="btn btn-primary" style="margin-top:10px;font-size:13px;padding:6px 16px;" onclick="retrySaveList()">重试保存列表（${newItems.length} 张）</button>
        ${failed.length ? `<button class="btn btn-primary" style="margin-top:10px;font-size:13px;padding:6px 16px;" onclick="retryFailedUploads()">重试失败的 ${failed.length} 张</button>` : ''}`;
      showToast('图片已上传，但列表保存失败，请点"重试保存列表"', 'error');
    } else if (failed.length > 0) {
      failedUploadFiles = failed.map(f => f.file);
      progress.style.display = 'block';
      progress.innerHTML = `<div style="color:#ff6666;font-weight:700;">成功 ${newItems.length} 张，失败 ${failed.length} 张</div>
        <div style="margin-top:6px;word-break:break-all;">${failed.map(f => escapeHtml(f.file.name)).join('、')}</div>
        <button class="btn btn-primary" style="margin-top:10px;font-size:13px;padding:6px 16px;" onclick="retryFailedUploads()">重试失败的 ${failed.length} 张</button>`;
      if (newItems.length > 0) {
        state.images = state.images.concat(newItems);
        renderGallery();
      }
      showToast(`成功 ${newItems.length} 张，失败 ${failed.length} 张`, 'error');
    } else {
      progress.style.display = 'none';
      state.images = state.images.concat(newItems);
      renderGallery();
      showToast(`上传成功 ${newItems.length} 张到「${CAT_MAP[category] || category}」！`, 'success');
      closeUploadModal();
    }
  } catch(e) {
    btn.disabled = false; btn.textContent = '确认上传';
    progress.innerHTML = '上传失败：' + e.message;
    showToast('上传失败：' + e.message, 'error');
  }
}

// 一键重试上次失败的图片
function retryFailedUploads() {
  if (!failedUploadFiles.length) return;
  pendingRetryFiles = failedUploadFiles.slice();
  failedUploadFiles = [];
  doUpload();
}

// 重试保存"已上传但列表没记录"的图片
async function retrySaveList() {
  if (!state.unsavedItems || !state.unsavedItems.length) return;
  const prog = document.getElementById('uploadProgress');
  const btn = prog ? prog.querySelector('.btn') : null;
  if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
  try {
    await updateManifest('addMany', state.unsavedItems);
    state.images = state.images.concat(state.unsavedItems);
    state.unsavedItems = [];
    renderGallery();
    if (prog) prog.style.display = 'none';
    showToast('列表已保存成功，图片已恢复显示', 'success');
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '重试保存列表'; }
    showToast('列表保存失败：' + e.message, 'error');
  }
}

// 自愈：管理员模式加载时双向修复 manifest 与仓库文件的一致性
// 1) 孤儿：文件在仓库但列表没记录（上传时列表保存失败）→ 自动补录
// 2) 幽灵：列表有记录但文件已不存在（删除时列表保存失败/异常）→ 自动清除，避免黑图
let lastHealAt = 0;
async function selfHealManifest() {
  if (Date.now() - lastHealAt < 10 * 60 * 1000) return; // 10 分钟节流
  lastHealAt = Date.now();
  const { owner, repo, branch, token } = state.config;
  if (!token) return;
  try {
    const treeRes = await fetchWithTimeout(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`, {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!treeRes.ok) return;
    const tree = await treeRes.json();
    const imgRe = /^images\/[^\/]+\/[^\/]+\.(jpg|jpeg|png|webp|gif)$/i;
    const fileSet = new Set((tree.tree || []).map(t => t.path).filter(p => imgRe.test(p)));
    if (fileSet.size === 0) return;

    // 只清除幽灵记录（列表有记录但文件已删的失效记录，避免黑图）。
    // 重要：绝不做"孤儿补录"——GitHub trees API 有缓存延迟，删除后几分钟内
    // 仍返回旧树，会把已删除文件误当孤儿补录回来，导致"删了又恢复"。
    // 上传时列表保存失败已有专门的"重试保存列表"按钮兜底，不需要自动补录。
    const ghosts = [];
    for (const img of state.images) {
      if (imgRe.test(img.path || '') && !fileSet.has(img.path)) ghosts.push(img);
    }
    if (ghosts.length > 0) {
      await updateManifest('removeMany', ghosts);
      const ghostIds = new Set(ghosts.map(i => i.id));
      state.images = state.images.filter(i => !ghostIds.has(i.id));
      renderGallery();
      showToast(`已自动清除 ${ghosts.length} 张失效记录（黑图修复）`, 'success');
    }
  } catch(e) { /* 自愈失败不影响正常浏览 */ }
}

// ========== 删除 ==========
function openDeleteModal(index) {
  state.deleteTarget = index;
  document.getElementById('deleteModal').classList.add('active');
}

function closeDeleteModal() {
  state.deleteTarget = null;
  document.getElementById('deleteModal').classList.remove('active');
}

async function confirmDelete() {
  if (state.deleteTarget === null) return;
  const img = state.images[state.deleteTarget];
  if (!img) { closeDeleteModal(); return; }

  try {
    const { owner, repo, branch, token } = state.config;

    // 获取文件sha
    const fileRes = await fetchWithTimeout(`https://api.github.com/repos/${owner}/${repo}/contents/${img.path}?ref=${branch}`, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!fileRes.ok) throw new Error('文件不存在或获取失败');
    const fileData = await fileRes.json();

    // 删除文件
    const delRes = await fetchWithTimeout(`https://api.github.com/repos/${owner}/${repo}/contents/${img.path}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({
        message: `删除壁纸: ${img.filename}`,
        sha: fileData.sha,
        branch: branch
      })
    });
    if (!delRes.ok) {
      const err = await delRes.json();
      throw new Error(err.message || '删除失败');
    }

    // 更新manifest
    await updateManifest('remove', img);

    showToast('删除成功', 'success');
    closeDeleteModal();
    // 本地立即移除，不等 GitHub 缓存
    state.images = state.images.filter(i => i.id !== img.id);
    renderGallery();
  } catch(e) {
    showToast('删除失败: ' + e.message, 'error');
    closeDeleteModal();
  }
}

// ========== 更新manifest ==========
async function updateManifest(action, item) {
  const { owner, repo, branch, token } = state.config;
  const manifestPath = 'manifest.json';
  let lastErr = null;

  // 自动重试 3 次：防止网络抖动/并发冲突导致列表与文件不同步
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt > 0) await new Promise(r => setTimeout(r, 1500 * attempt));
    try {
      // 获取当前manifest和sha
      const res = await fetchWithTimeout(`https://api.github.com/repos/${owner}/${repo}/contents/${manifestPath}?ref=${branch}`, {
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
      });

      let manifest = { images: [] };
      let sha = null;
      if (res.ok) {
        const data = await res.json();
        sha = data.sha;
        try {
          manifest = JSON.parse(atob(data.content.replace(/\n/g, '')));
        } catch(e) { manifest = { images: [] }; }
      }

      if (action === 'add' || action === 'addMany') {
        const items = Array.isArray(item) ? item : [item];
        manifest.images = manifest.images.concat(items);
      } else if (action === 'remove' || action === 'removeMany') {
        const ids = new Set((Array.isArray(item) ? item : [item]).map(i => i.id));
        manifest.images = manifest.images.filter(i => !ids.has(i.id));
      }

      const content = btoa(unescape(encodeURIComponent(JSON.stringify(manifest, null, 2))));

      const putRes = await fetchWithTimeout(`https://api.github.com/repos/${owner}/${repo}/contents/${manifestPath}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify({
          message: '更新壁纸列表',
          content: content,
          sha: sha,
          branch: branch
        })
      });
      if (!putRes.ok) {
        const err = await putRes.json().catch(() => ({}));
        throw new Error(err.message || '更新列表失败');
      }
      return true;
    } catch(e) {
      lastErr = e;
    }
  }
  throw lastErr;
}

// ========== Toast ==========
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast active ' + type;
  setTimeout(() => t.classList.remove('active'), 3000);
}

// 点击遮罩关闭弹窗
document.querySelectorAll('.modal-mask').forEach(mask => {
  mask.addEventListener('click', (e) => {
    if (e.target === mask) mask.classList.remove('active');
  });
});

// 启动
init();
</script>
